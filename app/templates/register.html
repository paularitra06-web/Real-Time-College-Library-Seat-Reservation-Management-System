{% extends "base.html" %}

{% block content %}
<div class="flex justify-center mt-10">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center">Student Registration</h2>
        <form method="POST" action="{{ url_for('main.register') }}">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="reg_no">
                    Registration Number
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="reg_no" name="reg_no" type="text" required placeholder="e.g. 21BCE1234">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="name">
                    Full Name
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="name" name="name" type="text" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                    Password
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password" name="password" type="password" required>
            </div>
            <div class="flex items-center justify-between">
                <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" type="submit">
                    Register
                </button>
            </div>
        </form>
        <div class="mt-4 text-center text-sm">
            Already registered? <a href="{{ url_for('main.login') }}" class="text-blue-600 hover:underline">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
